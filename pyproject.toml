[project]
name = "mesoslide"
version = "0.5.0"
description = "A package for mesoscale tissue analysis using multiomics data"
authors = [{ name = "Ziyuan Zhao", email = "ziyuanzhao@fas.harvard.edu" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "ezslide>=0.1.4",
    "lazyslide-models>=0.0.4",
    "spatialdata>=0.8",
    "zarr>=3.0",
    "tifffile>=2025.5.21",
    "spatialdata-plot",
    "lazyslide>=0.12.0",
    "scipy",
]

[project.scripts]
tissue-seg = "mesoslide.cli.tissue_seg:main"
chn-norm   = "mesoslide.cli.chn_norm:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
ezslide = { path = "/n/scratch/users/z/ziz531/ezslide", editable = true }

[dependency-groups]
dev = [
    "distinctipy>=1.3.4",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
